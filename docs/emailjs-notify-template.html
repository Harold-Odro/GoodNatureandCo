<!--
  EmailJS template: Body Care Launch Notify
  Used by:
    - NotifyForm.jsx (Body Care "notify me when we launch" form)

  Set this template's ID as VITE_EMAILJS_NOTIFY_TEMPLATE_ID in your .env

  Variables consumed:
    {{from_email}}  the subscriber's email
    {{to_email}}    your destination address (currently hardcoded to hello@goodnature.com)
    {{message}}     "New subscriber for Body Care launch: <email>"

  EmailJS template Settings tab:
    Subject:   New Body Care subscriber: {{from_email}}
    To Email:  hello@goodnature.com
    From Name: Good Nature Website
    Reply To:  {{from_email}}
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; color: #2c3e50; max-width: 600px; margin: 0 auto; background-color: #faf9f6; padding: 32px 24px;">

  <!-- Header -->
  <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid #e5e1d8;">
    <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 24px; color: #5a6b54; letter-spacing: 1px;">
      Good Nature
    </div>
    <div style="font-size: 11px; color: #8a9085; text-transform: uppercase; letter-spacing: 2px; margin-top: 4px;">
      Body Care &mdash; New Subscriber
    </div>
  </div>

  <!-- Body -->
  <div style="margin: 32px 0; text-align: center;">
    <div style="font-size: 36px; margin-bottom: 16px;">🌿</div>
    <p style="font-size: 16px; line-height: 1.6; margin: 0 0 24px 0;">
      Someone just signed up to be notified when Body Care launches.
    </p>

    <!-- Subscriber email card -->
    <div style="background-color: #ffffff; border: 1px solid #e5e1d8; border-radius: 8px; padding: 24px; margin: 0 auto 24px auto; display: inline-block;">
      <div style="font-size: 11px; color: #8a9085; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;">
        Subscriber
      </div>
      <a href="mailto:{{from_email}}" style="color: #5a6b54; text-decoration: none; font-size: 18px; font-weight: 600;">
        {{from_email}}
      </a>
    </div>
  </div>

  <p style="font-size: 13px; line-height: 1.6; color: #6b7268; text-align: center; margin: 0 0 24px 0;">
    Add this address to your launch announcement list. They&rsquo;ll be expecting an email when Body Care goes live.
  </p>

  <!-- Footer -->
  <div style="text-align: center; padding-top: 24px; border-top: 1px solid #e5e1d8; margin-top: 24px; font-size: 12px; color: #8a9085;">
    <div>Good Nature</div>
    <div style="margin-top: 4px;">Reston, Virginia</div>
  </div>

</div>
